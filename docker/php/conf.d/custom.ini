; Настройки PHP (продакшен).
; Файл монтируется в /usr/local/etc/php/conf.d/zz-custom.ini —
; после правок достаточно перезапустить контейнер (make restart).

memory_limit = 512M

; Держите эти лимиты равными UPLOAD_LIMIT из .env (nginx client_max_body_size
; и phpMyAdmin берут значение оттуда). PHP-настройки из env не читаются.
upload_max_filesize = 256M
post_max_size = 256M

max_execution_time = 300
max_input_vars = 5000
date.timezone = UTC

; Продакшен: ошибки не показываем посетителям, пишем в лог
; (стандартный stderr php-fpm — виден через docker compose logs php).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
expose_php = Off

; OPcache: проверка изменений файлов не чаще раза в 2 секунды —
; после деплоя код подхватится почти сразу, оверхед минимальный.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

realpath_cache_size = 4096K
realpath_cache_ttl = 600

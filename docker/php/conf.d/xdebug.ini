; Режим Xdebug управляется переменной окружения XDEBUG_MODE (см. .env) —
; она имеет приоритет над xdebug.mode из этого файла.
; Значения: off | debug | develop | coverage | profile (можно через запятую).
xdebug.mode = off
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = yes
xdebug.idekey = PHPSTORM
xdebug.log_level = 0
